[project]
name = "put-api"
version = "0.1.0"
description = "Backend API for the Путь ridesharing application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.5",
  "asyncpg>=0.30.0",
  "fastapi[standard]>=0.116.1",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.0.43",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

