# Продакшен «Путь»: PostgreSQL + API + Caddy (HTTPS). Порт БД наружу не публикуется.
# Запуск на сервере: docker compose --env-file /opt/put/.env -f deploy/compose.prod.yaml up -d --build
name: put

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: put
      POSTGRES_USER: put
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U put -d put"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      PUT_ENVIRONMENT: production
      PUT_DATABASE_URL: postgresql+asyncpg://put:${POSTGRES_PASSWORD}@db:5432/put
      PUT_JWT_SECRET: ${PUT_JWT_SECRET:?set PUT_JWT_SECRET}
      PUT_MEDIA_DIR: /app/media
      PUT_CORS_ORIGINS: '[]'
    volumes:
      - media-data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUT_DOMAIN: ${PUT_DOMAIN:?set PUT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
